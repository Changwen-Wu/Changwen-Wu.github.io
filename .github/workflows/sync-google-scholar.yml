name: Sync Google Scholar publications

on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install publication tools
        run: python -m pip install scholarly==1.7.11 bibtexparser==1.4.3 requests pypdf>=5
      - name: Fetch publications
        run: python scripts/sync_google_scholar.py
      - name: Fetch openly licensed full texts and supplements
        run: python scripts/sync_open_access_fulltexts.py
      - name: Commit updated publications and files
        run: |
          git add _data/google_scholar_publications.json _data/publication_pdfs.json _data/publication_supplements.json _data/publication_fulltext_status.json files/publications/
          if git diff --cached --quiet; then
            echo "No publication changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update publications and accessible full texts"
          git push
