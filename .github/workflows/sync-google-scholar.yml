name: Sync Google Scholar publications

on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scraper
        run: python -m pip install scholarly==1.7.11 bibtexparser==1.4.3
      - name: Fetch publications
        run: python scripts/sync_google_scholar.py
      - name: Commit updated list
        run: |
          if git diff --quiet -- _data/google_scholar_publications.json; then
            echo "No publication changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/google_scholar_publications.json
          git commit -m "Update Google Scholar publications"
          git push
